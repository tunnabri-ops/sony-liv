name: Auto Update SonyLiv

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest files (No Cache)
        run: |
          TIMESTAMP=$(date +%s)
          # SonyLiv ফাইল ডাউনলোড
          curl -H "Cache-Control: no-cache" -sL "https://raw.githubusercontent.com/srhady/SonyLiv/main/sonyliv.m3u?t=${TIMESTAMP}" -o sonyliv.m3u
          curl -H "Cache-Control: no-cache" -sL "https://raw.githubusercontent.com/srhady/SonyLiv/main/sonyliv.json?t=${TIMESTAMP}" -o sonyliv.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update SonyLiv: $(date)" && git push origin main)
