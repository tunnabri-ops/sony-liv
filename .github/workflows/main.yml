name: Auto Update SonyLiv

on:
  schedule:
    # প্রতি ৫ মিনিট পর পর স্বয়ংক্রিয়ভাবে চেক ও আপডেট করবে
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SonyLiv files
        run: |
          TIMESTAMP=$(date +%s)
          # মূল রিপোজিটরির সঠিক নাম অনুযায়ী ফাইল ডাউনলোড
          curl -H "Cache-Control: no-cache" -sL "https://raw.githubusercontent.com/srhady/SonyLiv/main/sonyliv_playlist.m3u?t=${TIMESTAMP}" -o sonyliv_playlist.m3u
          curl -H "Cache-Control: no-cache" -sL "https://raw.githubusercontent.com/srhady/SonyLiv/main/sonyliv_playlist.json?t=${TIMESTAMP}" -o sonyliv_playlist.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sonyliv_playlist.m3u sonyliv_playlist.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update SonyLiv: $(date)" && git push origin main)
